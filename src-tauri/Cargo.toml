[package]
name = "sellix-desktop"
version = "0.1.0"
description = "Sellix offline Windows POS"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
rfd = "0.15"
chrono = "0.4"
aes = "0.8"
ctr = "0.9"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
