<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/sellix.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Sellix POS</title>
    <!--
      Startup loader styles live here (not in index.css) so the loader is fully styled on the
      very first paint, before any JS/CSS bundle has loaded. The React <AppLoader /> reuses
      these same classes, so the hand-off from this static markup to React is seamless.
    -->
    <style>
      .app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px)
          env(safe-area-inset-left, 0px);
        background: #ffffff;
        color: #091413;
        font-family: 'DM Sans', 'Noto Sans', 'Segoe UI', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-align: center;
      }
      .app-loader__logo {
        display: block;
        width: 56px;
        height: 56px;
        border-radius: 16px;
      }
      .app-loader__name {
        margin: 20px 0 0;
        font-size: 17px;
        font-weight: 600;
        line-height: 1.3;
        letter-spacing: -0.01em;
      }
      .app-loader__status {
        margin: 2px 0 0;
        font-size: 13px;
        line-height: 1.4;
        color: #64748b;
      }
      .app-loader__spinner {
        margin-top: 28px;
        width: 18px;
        height: 18px;
        box-sizing: border-box;
        border-radius: 9999px;
        border: 2px solid #e6f1ea;
        border-top-color: #1f5e3b;
        animation: app-loader-spin 0.8s linear infinite;
      }
      @keyframes app-loader-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (min-width: 768px) {
        .app-loader__logo {
          width: 64px;
          height: 64px;
          border-radius: 18px;
        }
        .app-loader__name {
          font-size: 18px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-loader__spinner {
          animation-duration: 1.6s;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Replaced by React as soon as startup (SQLite init) finishes and the app renders. -->
      <div class="app-loader" role="status" aria-live="polite">
        <img class="app-loader__logo" src="/src/assets/sellix-mark.png" alt="" width="64" height="64" />
        <p class="app-loader__name">Sellix</p>
        <p class="app-loader__status">Loading…</p>
        <span class="app-loader__spinner" aria-hidden="true"></span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
