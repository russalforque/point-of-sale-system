<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sellix POS — Spatial Film</title>
<style>
@font-face { font-family: "Inter"; src: url(assets/inter.woff2) format("woff2"); font-weight: 100 900; font-display: block; }
@font-face { font-family: "JB Mono"; src: url(assets/jbmono.woff2) format("woff2"); font-weight: 100 900; font-display: block; }
:root {
  --g900: #04140d; --g800: #0a2a1d; --g700: #1f5a45; --g500: #16a34a; --g400: #22c55e; --g300: #4ade80; --g100: #dcfce7;
  --ink: #111827; --muted: #6b7280; --line: #e5e7eb; --canvas: #f3f4f6;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--g900); }
body { font-family: "Inter", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
#stage {
  position: absolute; inset: 0; overflow: hidden;
  perspective: 1500px; perspective-origin: 50% 50%;
  background:
    radial-gradient(1200px 700px at 50% 38%, rgba(34,197,94,.20), transparent 70%),
    radial-gradient(900px 600px at 85% 90%, rgba(22,163,74,.12), transparent 70%),
    radial-gradient(800px 500px at 10% 10%, rgba(31,90,69,.35), transparent 70%),
    linear-gradient(180deg, #03100a 0%, #062014 55%, #03100a 100%);
}
.scene, .obj { position: absolute; left: 0; top: 0; transform-style: preserve-3d; transform-origin: 0 0; }
.scene { left: 960px; top: 540px; }
.flat { transform-style: flat; }
.hide { display: none; }

/* background */
#floor {
  width: 7000px; height: 7000px;
  background-image:
    linear-gradient(rgba(74,222,128,.22) 2px, transparent 2px),
    linear-gradient(90deg, rgba(74,222,128,.22) 2px, transparent 2px);
  background-size: 140px 140px;
  -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 0%, rgba(0,0,0,.6) 18%, transparent 42%);
}
.dot { position: absolute; left: 0; top: 0; border-radius: 50%; background: var(--g300); box-shadow: 0 0 12px 2px rgba(74,222,128,.7); }

/* generic panel */
.panel { background: #fff; border-radius: 22px; overflow: visible;
  box-shadow: 0 40px 120px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.6) inset; }
.edge { position: absolute; inset: 0; border-radius: 22px; background: linear-gradient(135deg, #2a7a5c, #0b3424); transform: translateZ(-14px); }
.glass { background: rgba(10,42,29,.55); border: 1px solid rgba(74,222,128,.35); border-radius: 22px; color: #eafff2;
  box-shadow: 0 30px 90px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.12); }

/* captions */
#caption { position: absolute; left: 110px; bottom: 96px; color: #fff; }
#caption .k { font: 700 18px "JB Mono", monospace; letter-spacing: .32em; color: var(--g300); margin-bottom: 14px; display: flex; align-items: center; gap: 14px; }
#caption .k::before { content: ""; width: 40px; height: 2px; background: var(--g300); display: inline-block; }
#caption .h { font-weight: 700; font-size: 50px; letter-spacing: -.02em; max-width: 1200px; text-shadow: 0 6px 40px rgba(0,0,0,.6); }
#vignette { position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.65) 100%); }
#capshade { position: absolute; left: 0; right: 0; bottom: 0; height: 340px; pointer-events: none; background: linear-gradient(0deg, rgba(2,10,6,.85), rgba(2,10,6,.45) 45%, transparent); }
#fade { position: absolute; inset: 0; background: #000; pointer-events: none; }
#brandbug { position: absolute; right: 90px; top: 70px; display: flex; align-items: center; gap: 14px; color: rgba(255,255,255,.85); font-weight: 700; font-size: 22px; letter-spacing: .02em; }
#brandbug img { width: 40px; height: 40px; border-radius: 10px; }

/* intro */
.title { font-weight: 800; font-size: 150px; letter-spacing: -.045em; color: #fff; white-space: nowrap; text-shadow: 0 20px 80px rgba(34,197,94,.35); }
.title span { display: inline-block; }
.title .pos { color: var(--g400); }
.sub { font-weight: 500; font-size: 34px; color: rgba(230,255,240,.8); white-space: nowrap; letter-spacing: -.01em; }
.markcard { width: 260px; height: 260px; border-radius: 60px; background: url(assets/sellix-mark.png) center/cover; box-shadow: 0 0 120px rgba(34,197,94,.45), 0 40px 100px rgba(0,0,0,.6); }

/* register */
.hdr { position: absolute; left: 0; top: 0; right: 0; height: 66px; border-bottom: 1px solid var(--line); display: flex; align-items: center; padding: 0 24px; gap: 16px; }
.hdr img { width: 36px; height: 36px; border-radius: 9px; }
.hdr b { font-size: 22px; }
.pill { font-size: 14px; font-weight: 600; padding: 6px 12px; border-radius: 999px; background: var(--g100); color: #166534; }
.muted { color: var(--muted); }
.search { position: absolute; left: 24px; top: 86px; width: 360px; height: 42px; border: 1px solid var(--line); border-radius: 12px; display: flex; align-items: center; padding: 0 14px; color: #9ca3af; font-size: 16px; gap: 10px; }
.chip { position: absolute; top: 86px; height: 42px; padding: 0 18px; border-radius: 12px; font-size: 15px; font-weight: 600; display: flex; align-items: center; background: var(--canvas); color: #374151; }
.chip.on { background: var(--g700); color: #fff; }
.tile { position: absolute; width: 196px; height: 196px; border-radius: 18px; border: 1px solid var(--line); background: #fff; padding: 16px; transform-origin: 50% 50%; }
.tile .em { font-size: 64px; height: 92px; display: flex; align-items: center; justify-content: center; background: #f0fdf4; border-radius: 14px; }
.tile .n { font-weight: 600; font-size: 17px; margin-top: 12px; }
.tile .p { font-weight: 700; font-size: 18px; color: var(--g700); margin-top: 4px; }
.tile .stk { position: absolute; right: 14px; top: 14px; font-size: 12px; font-weight: 600; color: var(--muted); background: #fff; border-radius: 8px; padding: 2px 7px; }
.cart { position: absolute; left: 884px; top: 86px; width: 392px; height: 672px; border-radius: 18px; background: #f9fafb; border: 1px solid var(--line); }
.cart h4 { position: absolute; left: 20px; top: 18px; font-size: 19px; }
.cart .cnt { position: absolute; right: 20px; top: 18px; }
.line { position: absolute; left: 14px; width: 364px; height: 56px; background: #fff; border: 1px solid var(--line); border-radius: 12px; display: flex; align-items: center; padding: 0 14px; gap: 12px; font-size: 16px; }
.line .q { width: 30px; height: 30px; border-radius: 8px; background: var(--g100); color: #166534; font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 14px; }
.line .nm { flex: 1; font-weight: 600; }
.line .amt { font-weight: 700; font-family: "JB Mono", monospace; }
.tot { position: absolute; left: 20px; right: 20px; top: 470px; font-size: 16px; }
.tot div { display: flex; justify-content: space-between; margin-bottom: 10px; color: #374151; }
.tot .grand { font-size: 28px; font-weight: 800; color: var(--ink); margin-top: 6px; }
.tot .grand span:last-child { font-family: "JB Mono", monospace; }
.charge { position: absolute; left: 20px; right: 20px; top: 596px; height: 60px; border-radius: 14px; background: var(--g700); color: #fff; font-weight: 700; font-size: 21px; display: flex; align-items: center; justify-content: center; transform-origin: 50% 50%; }
.fly { width: 84px; height: 84px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 46px; box-shadow: 0 20px 50px rgba(0,0,0,.35), 0 0 0 4px var(--g400); }
.ripple { position: absolute; border-radius: 50%; border: 4px solid var(--g400); }

/* payment modal */
.pay { width: 600px; height: 580px; padding: 32px; }
.pay h3 { font-size: 26px; }
.seg { display: flex; gap: 10px; margin-top: 22px; }
.seg div { flex: 1; height: 54px; border-radius: 12px; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 17px; gap: 8px; }
.seg .on { border: 2px solid var(--g500); background: #f0fdf4; color: #166534; }
.due { margin-top: 24px; display: flex; justify-content: space-between; font-size: 18px; color: var(--muted); }
.due b { color: var(--ink); font-family: "JB Mono", monospace; font-size: 22px; }
.tender { margin-top: 14px; height: 86px; border-radius: 14px; background: var(--canvas); display: flex; align-items: center; justify-content: flex-end; padding: 0 24px; font: 700 44px "JB Mono", monospace; }
.quick { display: flex; gap: 10px; margin-top: 14px; }
.quick div { flex: 1; height: 46px; border-radius: 10px; background: #fff; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-weight: 600; font-family: "JB Mono", monospace; }
.quick .on { background: var(--g700); color: #fff; border-color: var(--g700); }
.change { margin-top: 18px; display: flex; justify-content: space-between; align-items: center; font-size: 20px; font-weight: 600; color: #166534; background: #f0fdf4; border-radius: 12px; padding: 14px 18px; }
.change b { font: 800 30px "JB Mono", monospace; }
.done { position: absolute; left: 32px; right: 32px; bottom: 30px; height: 62px; border-radius: 14px; background: var(--g500); color: #fff; font-weight: 700; font-size: 21px; display: flex; align-items: center; justify-content: center; gap: 10px; transform-origin: 50% 50%; }
.okbadge { width: 200px; height: 200px; border-radius: 50%; background: var(--g500); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 16px rgba(34,197,94,.25), 0 30px 80px rgba(0,0,0,.5); }

/* printer & receipt */
.face { position: absolute; left: 50%; top: 50%; backface-visibility: hidden; }
.rwrap { position: absolute; width: 300px; overflow: hidden; left: -150px; }
.receipt { position: absolute; left: 0; top: 0; width: 300px; background: #fffef8; padding: 22px 18px 26px; font: 500 13.5px/1.55 "JB Mono", monospace; color: #1f2937; white-space: pre; box-shadow: 0 0 40px rgba(0,0,0,.25); }
.receipt b { font-weight: 700; }
.receipt .bc { height: 46px; margin-top: 10px; background: repeating-linear-gradient(90deg, #111 0 2px, transparent 2px 4px, #111 4px 7px, transparent 7px 9px, #111 9px 10px, transparent 10px 13px); }

/* insights */
.ip { width: 760px; height: 520px; padding: 28px; }
.ip h3 { font-size: 24px; display: flex; justify-content: space-between; align-items: center; }
.kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 20px; }
.kpi { border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.kpi .l { font-size: 14px; color: var(--muted); font-weight: 500; }
.kpi .v { font: 700 28px "JB Mono", monospace; margin-top: 4px; letter-spacing: -.02em; }
.kpi .d { font-size: 13px; color: var(--g500); font-weight: 600; }
.bars { position: absolute; left: 28px; right: 28px; bottom: 26px; height: 170px; display: flex; align-items: flex-end; gap: 10px; border-bottom: 1px solid var(--line); }
.bars div { flex: 1; border-radius: 6px 6px 0 0; background: linear-gradient(180deg, var(--g400), var(--g700)); }
.inv { margin-top: 18px; }
.ir { display: flex; align-items: center; gap: 14px; height: 60px; border-bottom: 1px solid var(--line); font-size: 16px; }
.ir .e { font-size: 28px; width: 36px; }
.ir .nm { width: 210px; font-weight: 600; }
.ir .bar { flex: 1; height: 10px; border-radius: 6px; background: var(--canvas); position: relative; overflow: hidden; }
.ir .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: var(--g500); }
.ir .qty { width: 54px; text-align: right; font: 700 16px "JB Mono", monospace; }
.ir .st { width: 104px; text-align: center; font-size: 13px; font-weight: 700; border-radius: 999px; padding: 5px 0; background: var(--g100); color: #166534; }
.ir .st.low { background: #fee2e2; color: #b91c1c; }
.ir .bar i.low { background: #ef4444; }
.top5 { display: flex; gap: 10px; margin-top: 12px; }
.top5 div { flex: 1; border-radius: 12px; background: var(--canvas); padding: 10px 12px; font-size: 13px; font-weight: 600; }
.top5 b { display: block; font: 700 17px "JB Mono", monospace; color: var(--g700); margin-top: 2px; }

/* network */
.board { width: 1800px; height: 1000px; border-radius: 40px;
  background: radial-gradient(circle at 50% 50%, rgba(34,197,94,.16), rgba(4,20,13,.0) 70%);
  border: 1px solid rgba(74,222,128,.18); }
.phone { width: 300px; height: 610px; border-radius: 46px; background: #0b0f0d; padding: 14px; box-shadow: 0 40px 100px rgba(0,0,0,.6), 0 0 0 2px #2b3a33 inset; }
.phone .scr { width: 100%; height: 100%; border-radius: 34px; background: var(--canvas); overflow: hidden; position: relative; }
.mhdr { height: 70px; background: var(--g700); color: #fff; padding: 30px 18px 0; font-weight: 700; font-size: 17px; display: flex; justify-content: space-between; }
.mgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px; }
.mgrid div { height: 92px; border-radius: 14px; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 34px; }
.mgrid div span { font-size: 11px; font-weight: 600; color: #374151; margin-top: 2px; }
.mbar { position: absolute; left: 12px; right: 12px; bottom: 14px; height: 54px; border-radius: 14px; background: var(--g500); color: #fff; font-weight: 700; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; font-size: 16px; }
.monitor { width: 560px; height: 350px; border-radius: 18px; background: #0b0f0d; padding: 12px; box-shadow: 0 40px 100px rgba(0,0,0,.6); }
.monitor .scr { width: 100%; height: 100%; border-radius: 10px; background: #fff; overflow: hidden; position: relative; }
.stand { width: 150px; height: 70px; margin: 0 auto; background: linear-gradient(#1f2a25, #0b0f0d); clip-path: polygon(35% 0, 65% 0, 80% 100%, 20% 100%); }
.mini-hdr { height: 34px; border-bottom: 1px solid var(--line); display: flex; align-items: center; padding: 0 12px; gap: 8px; font-size: 12px; font-weight: 700; }
.mini-grid { position: absolute; left: 12px; top: 46px; width: 330px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.mini-grid div { height: 64px; border-radius: 8px; background: #f0fdf4; display: flex; align-items: center; justify-content: center; font-size: 28px; }
.mini-cart { position: absolute; right: 12px; top: 46px; width: 170px; bottom: 12px; border-radius: 8px; background: #f9fafb; border: 1px solid var(--line); padding: 8px; }
.mini-cart i { display: block; height: 18px; border-radius: 5px; background: #e5e7eb; margin-bottom: 7px; }
.mini-cart b { position: absolute; left: 8px; right: 8px; bottom: 8px; height: 30px; border-radius: 6px; background: var(--g700); }
.node { width: 230px; height: 230px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #eafff2; font-weight: 700; font-size: 22px; gap: 6px;
  background: radial-gradient(circle at 35% 30%, #2a7a5c, #0a2a1d 75%); border: 2px solid rgba(74,222,128,.55); box-shadow: 0 0 80px rgba(34,197,94,.45); }
.node small { font: 600 14px "JB Mono", monospace; color: var(--g300); }
.badge { padding: 14px 22px; font-weight: 700; font-size: 20px; white-space: nowrap; display: flex; align-items: center; gap: 12px; border-radius: 16px; }
.badge .ic { width: 34px; height: 34px; border-radius: 10px; background: var(--g500); display: flex; align-items: center; justify-content: center; }
.status { padding: 10px 18px; border-radius: 999px; font: 700 17px "JB Mono", monospace; white-space: nowrap; }

/* feature tiles */
.ft { width: 440px; height: 250px; padding: 30px; }
.ft .ic { width: 64px; height: 64px; border-radius: 16px; background: linear-gradient(135deg, var(--g400), var(--g700)); display: flex; align-items: center; justify-content: center; }
.ft h4 { font-size: 27px; margin-top: 22px; color: #fff; letter-spacing: -.01em; }
.ft p { font-size: 17px; margin-top: 8px; color: rgba(220,252,231,.75); line-height: 1.4; }
</style>
</head>

</div>

const prn = mk(SW, `<div style="width:260px;height:190px;border-radius:26px;background:linear-gradient(#2b3631,#101613);box-shadow:0 30px 80px rgba(0,0,0,.6);position:relative">
  <div style="position:absolute;left:30px;right:30px;top:-70px;height:84px;background:#fffef8;border-radius:4px 4px 0 0;font:600 11px/1.6 'JB Mono',monospace;padding:8px 12px;color:#374151;white-space:pre">SELLIX CAFÉ\n2 Iced Coffee 240.00\nTOTAL      ₱700.00</div>
  <div style="position:absolute;left:24px;right:24px;top:8px;height:12px;border-radius:6px;background:#050806"></div>
  <div style="position:absolute;right:26px;bottom:26px;width:14px;height:14px;border-radius:50%;background:#22c55e;box-shadow:0 0 14px 4px #22c55e"></div>
  <div style="position:absolute;left:26px;bottom:22px;font:700 13px 'JB Mono',monospace;color:#9ca3af;letter-spacing:.15em">THERMAL 80mm</div></div>`);
const cloud = mk(SW, `<div class="node">${icon("cloud", 64)}Sellix API<small>sync · backup</small></div>`);
const bDb = mk(SW, `<div class="glass badge"><span class="ic">${icon("db", 22)}</span>Offline-first SQLite</div>`);
const bBt = mk(SW, `<div class="glass badge"><span class="ic">${icon("bt", 22)}</span>Bluetooth & USB printers</div>`);
const bAnd = mk(SW, `<div class="glass badge"><span class="ic">${icon("check", 22)}</span>Android · Windows · Web</div>`);
const beam = mk(SW, '<div style="width:6px;height:520px;border-radius:3px;background:linear-gradient(rgba(74,222,128,.95),rgba(74,222,128,.05));box-shadow:0 0 24px rgba(74,222,128,.8)"></div>');
const status = mk(SW, `<div class="status"></div>`);
const statusEl = status.firstElementChild;
function renderNet(t) {
  const p = seg(t, 25.6, 31.6);
  cam(SW, { x: 0, y: lerp(60, -20, eio(p)), z: lerp(900, 280, eio(seg(t, 25.6, 27.4))) - p * 140, rx: lerp(30, 14, eio(p)), ry: lerp(-22, 18, eio(p)) });
  const BRX = 58;
  T(board, { x: 0, y: 160, z: 0, rx: BRX });
  O(board, seg(t, 25.8, 26.6));
  // map board point (bx,by) into scene coords so standing objects sit on the board
  const onB = (bx, by, lift = 0) => {
    const dx = bx - 900, dy = by - 500, r = BRX * Math.PI / 180;
    return { x: dx, y: 160 + dy * Math.cos(r) - lift, z: dy * Math.sin(r) };
  };
  const pop = (k, a) => back(seg(t, a, a + .8));
  const P1 = onB(380, 640, 320), P2 = onB(900, 660, 230), P3 = onB(1420, 640, 110), P4 = onB(900, 260, 560);
  const a1 = pop(1, 26.1), a2 = pop(2, 26.35), a3 = pop(3, 26.6), a4 = pop(4, 26.85);
  T(phone, { ...P1, y: P1.y + (1 - a1) * 300, ry: 16 + Math.sin(t) * 4, s: a1 }); O(phone, seg(t, 26.1, 26.4));
  T(mon, { ...P2, y: P2.y + (1 - a2) * 300, s: a2 }); O(mon, seg(t, 26.35, 26.6));
  T(prn, { ...P3, y: P3.y + (1 - a3) * 300, ry: -18, s: a3 }); O(prn, seg(t, 26.6, 26.9));
  T(cloud, { ...P4, y: P4.y - 60 + Math.sin(t * 1.4) * 12, s: a4 }); O(cloud, seg(t, 26.85, 27.1));
  // offline story: phone loses connection 28.2 – 29.6, then syncs
  const offline = t > 28.2 && t < 29.6;
  const synced = t >= 29.6;
  const flow = -t * 160;
  linkEls.forEach((l, i) => {
    const drawn = eout(seg(t, 27 + i * .15, 27.8 + i * .15));
    const isPhone = i === 0;
    const off = isPhone && offline;
    l.setAttribute("stroke", off ? "rgba(248,113,113,.9)" : "rgba(74,222,128,.95)");
    l.setAttribute("stroke-dasharray", off ? "4 22" : "26 18");
    l.setAttribute("stroke-dashoffset", flow);
    l.style.opacity = drawn * (off ? .7 : 1);
  });
  const BM = onB(900, 260, 260);
  T(beam, { ...BM, s: 1 }); O(beam, eout(seg(t, 27.4, 28)));
  beam.firstElementChild.style.height = 520 * eout(seg(t, 27.4, 28)) + 'px';
  T(status, { x: P1.x, y: P1.y - 360, z: P1.z + 40 });
  if (t < 28.2) { statusEl.textContent = "● Online"; Object.assign(statusEl.style, { background: "rgba(22,163,74,.9)", color: "#fff" }); }
  else if (offline) { statusEl.textContent = "○ Offline · 3 sales saved locally"; Object.assign(statusEl.style, { background: "rgba(220,38,38,.9)", color: "#fff" }); }
  else { statusEl.textContent = "✓ Back online · synced"; Object.assign(statusEl.style, { background: "rgba(22,163,74,.9)", color: "#fff" }); }
  O(status, seg(t, 27.2, 27.6));
  const sp = Math.sin(seg(t, 29.6, 30.2) * Math.PI);
  statusEl.style.boxShadow = `0 0 0 ${sp * 14}px rgba(74,222,128,.35)`;
  const bp = i => eout(seg(t, 27.6 + i * .3, 28.3 + i * .3));
  const B1 = onB(560, 900, 90), B2 = onB(1420, 640, 360), B3 = onB(1500, 260, 520);
  T(bDb, { ...B1, z: B1.z + 80 + (1 - bp(0)) * 200 }); O(bDb, bp(0));
  T(bBt, { ...B2, z: B2.z + 80 + (1 - bp(1)) * 200 }); O(bBt, bp(1));
  T(bAnd, { ...B3, z: B3.z + (1 - bp(2)) * 200 }); O(bAnd, bp(2));
}

/* ---------------- 6. feature wall (31.2 – 36) ---------------- */
const SF = $("#s-ft");
const FEAT = [
  ["clock", "Shifts & cash drawer", "Open, close and reconcile every shift."],
  ["undo", "Returns & refunds", "Process returns with full traceability."],
  ["truck", "Suppliers & stock-in", "Purchase orders, receiving, adjustments."],
  ["users", "Customers", "Profiles, history and loyalty at checkout."],
  ["list", "Audit log", "Every change, by who and when."],
  ["shield", "Roles & permissions", "Cashier, manager, admin — each in their lane."],
];
const fts = FEAT.map(f => mk(SF, `<div class="ic">${icon(f[0], 34)}</div><h4>${f[1]}</h4><p>${f[2]}</p>`, "obj glass ft"));
function renderFt(t) {
  const p = seg(t, 31.2, 36);
  cam(SF, { z: lerp(500, 60, eio(p)), rx: lerp(14, -4, eio(p)), ry: lerp(16, -12, eio(p)), x: lerp(-60, 60, p) });
  fts.forEach((el, i) => {
    const c = i % 3, r = Math.floor(i / 3);
    const q = back(seg(t, 31.5 + i * .14, 32.5 + i * .14));
    const wave = Math.sin(t * 1.6 + i * .9) * 14;
    T(el, { x: (c - 1) * 480, y: (r - .5) * 290, z: lerp(-500, 0, q) + wave, ry: lerp(-100, 0, q), rx: lerp(30, 0, q) });
    O(el, seg(t, 31.5 + i * .14, 31.9 + i * .14));
  });
}

/* ---------------- 7. end card (35.6 – 40) ---------------- */
const SE = $("#s-end");
const eMark = mk(SE, '<div class="markcard" style="width:200px;height:200px;border-radius:48px"></div>');
const eTitle = mk(SE, '<div class="title" style="font-size:120px">Sellix <span class="pos">POS</span></div>');
const eTag = mk(SE, '<div class="sub" style="font-size:38px;color:#fff;font-weight:600">Sell smarter. Anywhere.</div>');
const eMeta = mk(SE, '<div class="sub" style="font:600 20px \'JB Mono\',monospace;letter-spacing:.3em;color:var(--g300)">ANDROID · DESKTOP · OFFLINE-FIRST</div>');
const eRing = mk(SE, '<div style="width:700px;height:700px;border-radius:50%;border:2px solid rgba(74,222,128,.35);box-shadow:0 0 80px rgba(34,197,94,.25) inset"></div>');
function renderEnd(t) {
  const p = seg(t, 35.6, 40);
  cam(SE, { z: lerp(300, 0, eout(p)), ry: lerp(-12, 4, eio(p)), rx: lerp(-6, 2, p) });
  const m = back(seg(t, 35.8, 36.8));
  T(eMark, { y: -170, z: lerp(-400, 0, m), ry: lerp(180, 0, eout(seg(t, 35.8, 37))) + Math.sin(t * 1.3) * 5, s: m });
  O(eMark, seg(t, 35.8, 36.1));
  const r = eout(seg(t, 36, 38));
  T(eRing, { y: -170, z: -120, rx: 74, s: lerp(.2, 1.3, r), rz: t * 20 }); O(eRing, r * (1 - seg(t, 38, 39.4)) * .9);
  const tp = eout(seg(t, 36.3, 37.2));
  T(eTitle, { y: 40, z: lerp(-200, 30, tp), rx: lerp(-50, 0, tp) }); O(eTitle, tp);
  const gp = eout(seg(t, 36.9, 37.7));
  T(eTag, { y: 150, z: lerp(-120, 20, gp) }); O(eTag, gp);
  const mp = eout(seg(t, 37.4, 38.2));
  T(eMeta, { y: 222, z: 10 }); O(eMeta, mp);
  eMeta.firstElementChild.style.letterSpacing = lerp(.6, .3, mp) + "em";
}

/* ---------------- captions & master ---------------- */
const CAPS = [
  [5.4, 10.3, "REGISTER", "Ring up orders in seconds."],
  [10.6, 13.9, "PAYMENTS", "Cash, card or GCash — change done for you."],
  [14.3, 18.5, "PRINTING", "ESC/POS receipts, straight to your thermal printer."],
  [19.4, 25.6, "INSIGHTS", "Live sales, inventory and reports at a glance."],
  [26.3, 31.1, "EVERYWHERE", "Android & desktop. Sells offline, syncs later."],
  [31.7, 35.5, "OPERATIONS", "Everything your store runs on, built in."],
];
const capEl = $("#caption"), capK = $("#caption .k"), capH = $("#caption .h");
function renderCaption(t) {
  const c = CAPS.find(c => t >= c[0] && t <= c[1]);
  if (!c) { capEl.style.opacity = 0; return; }
  const a = Math.min(seg(t, c[0], c[0] + .5), 1 - seg(t, c[1] - .4, c[1]));
  capK.textContent = c[2]; capH.textContent = c[3];
  capEl.style.opacity = a;
  capEl.style.transform = `translateY(${lerp(24, 0, eout(seg(t, c[0], c[0] + .6)))}px)`;
  capEl.style.filter = `blur(${(1 - a) * 6}px)`;
}

const SCENES = [
  [SI, 0, 5.2, renderIntro, 0, .7],
  [SR, 4.6, 19.2, renderReg, .8, .8],
  [SN, 18.6, 26.2, renderIns, .7, .7],
  [SW, 25.6, 31.6, renderNet, .7, .7],
  [SF, 31.2, 36.0, renderFt, .6, .6],
  [SE, 35.6, 40.1, renderEnd, .6, 0.01],
];
window.render = function (t) {
  renderBg(t);
  for (const [el, a, b, fn, fi, fo] of SCENES) {
    if (t < a || t > b) { el.classList.add("hide"); continue; }
    el.classList.remove("hide");
    SA = fi === 0 ? 1 - seg(t, b - fo, b) : sceneAlpha(t, a, b, fi, fo);
    fn(t);
  }
  renderCaption(t);
  $("#brandbug").style.opacity = seg(t, 5, 6) * (1 - seg(t, 35.2, 35.8)) * .9;
  $("#fade").style.opacity = Math.max(1 - seg(t, 0, .6), seg(t, 39.2, 40));
};
window.DURATION = DURATION;
window.ready = document.fonts.ready.then(() => Promise.all([...document.images].map(i => i.decode().catch(() => {}))));
if (!/[?&]capture/.test(location.search)) {
  // live preview: loop in real time
  const t0 = performance.now();
  window.ready.then(() => { const loop = now => { render(((now - t0) / 1000) % DURATION); requestAnimationFrame(loop); }; requestAnimationFrame(loop); });
}
</script>
</body>
