<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sellix POS — Spatial Film</title>
<style>
@font-face { font-family: "Inter"; src: url(assets/inter.woff2) format("woff2"); font-weight: 100 900; font-display: block; }
@font-face { font-family: "JB Mono"; src: url(assets/jbmono.woff2) format("woff2"); font-weight: 100 900; font-display: block; }
:root {
  --g900: #04140d; --g800: #0a2a1d; --g700: #1f5e3b; --g500: #16a34a; --g400: #22c55e; --g300: #4ade80; --g100: #dcfce7;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--g900); }
body { font-family: "Inter", sans-serif; color: #111827; -webkit-font-smoothing: antialiased; }
#stage {
  position: absolute; inset: 0; overflow: hidden;
  perspective: 1500px; perspective-origin: 50% 50%;
  background:
    radial-gradient(1200px 700px at 50% 38%, rgba(34,197,94,.20), transparent 70%),
    radial-gradient(900px 600px at 85% 90%, rgba(22,163,74,.12), transparent 70%),
    radial-gradient(800px 500px at 10% 10%, rgba(31,90,69,.35), transparent 70%),
    linear-gradient(180deg, #03100a 0%, #062014 55%, #03100a 100%);
}
.scene, .obj { position: absolute; left: 0; top: 0; transform-style: preserve-3d; transform-origin: 0 0; }
.scene { left: 960px; top: 540px; }
.flat { transform-style: flat; }
.hide { display: none; }

#floor {
  width: 7000px; height: 7000px;
  background-image:
    linear-gradient(rgba(74,222,128,.22) 2px, transparent 2px),
    linear-gradient(90deg, rgba(74,222,128,.22) 2px, transparent 2px);
  background-size: 140px 140px;
  -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 0%, rgba(0,0,0,.6) 18%, transparent 42%);
}
.dot { position: absolute; left: 0; top: 0; border-radius: 50%; background: var(--g300); box-shadow: 0 0 12px 2px rgba(74,222,128,.7); }

/* real-UI screens */
.screen { border-radius: 22px; box-shadow: 0 40px 120px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.5); background: #f5f7f6; }
.layer { position: absolute; inset: 0; border-radius: inherit; background-size: 100% 100%; background-repeat: no-repeat; }
.edge { position: absolute; inset: 0; border-radius: 22px; background: linear-gradient(135deg, #2a7a5c, #0b3424); transform: translateZ(-16px); }
.dim { position: absolute; inset: 0; border-radius: inherit; background: rgba(9, 20, 19, .45); }
.token { border-radius: 18px; background-repeat: no-repeat; box-shadow: 0 24px 60px rgba(0,0,0,.4), 0 0 0 4px var(--g400); }
.tap { width: 64px; height: 64px; border-radius: 50%; border: 4px solid var(--g400); background: rgba(34,197,94,.18); }
.glass { background: rgba(10,42,29,.55); border: 1px solid rgba(74,222,128,.35); border-radius: 22px; color: #eafff2;
  box-shadow: 0 30px 90px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.12); }

/* captions & overlays */
#caption { position: absolute; left: 110px; bottom: 96px; color: #fff; }
#caption .k { font: 700 18px "JB Mono", monospace; letter-spacing: .32em; color: var(--g300); margin-bottom: 14px; display: flex; align-items: center; gap: 14px; }
#caption .k::before { content: ""; width: 40px; height: 2px; background: var(--g300); display: inline-block; }
#caption .h { font-weight: 700; font-size: 50px; letter-spacing: -.02em; max-width: 1300px; text-shadow: 0 6px 40px rgba(0,0,0,.6); }
#vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.65) 100%); }
#capshade { position: absolute; left: 0; right: 0; bottom: 0; height: 340px; background: linear-gradient(0deg, rgba(2,10,6,.85), rgba(2,10,6,.45) 45%, transparent); }
#fade { position: absolute; inset: 0; background: #000; }
#brandbug { position: absolute; right: 90px; top: 70px; display: flex; align-items: center; gap: 14px; color: rgba(255,255,255,.85); font-weight: 700; font-size: 22px; }
#brandbug img { width: 40px; height: 40px; border-radius: 10px; }
#realui { position: absolute; left: 110px; top: 74px; font: 700 15px "JB Mono", monospace; letter-spacing: .25em; color: rgba(220,252,231,.7); display: flex; align-items: center; gap: 10px; }
#realui i { width: 9px; height: 9px; border-radius: 50%; background: #ef4444; box-shadow: 0 0 12px #ef4444; }

/* intro & end */
.title { font-weight: 800; font-size: 150px; letter-spacing: -.045em; color: #fff; white-space: nowrap; text-shadow: 0 20px 80px rgba(34,197,94,.35); }
.title span { display: inline-block; }
.title .pos { color: var(--g400); }
.sub { font-weight: 500; font-size: 34px; color: rgba(230,255,240,.8); white-space: nowrap; }
.markcard { width: 260px; height: 260px; border-radius: 60px; background: url(assets/sellix-mark.png) center/cover; box-shadow: 0 0 120px rgba(34,197,94,.45), 0 40px 100px rgba(0,0,0,.6); }

/* printer */
.face { position: absolute; left: 50%; top: 50%; backface-visibility: hidden; }
.rwrap { position: absolute; width: 320px; overflow: hidden; left: -160px; }
.paper { position: absolute; left: 0; top: 0; width: 320px; background: #fff url(shots/receipt.png) top center/300px auto no-repeat; padding-top: 10px; box-shadow: 0 0 40px rgba(0,0,0,.25); }

/* devices */
.board { width: 1800px; height: 1000px; border-radius: 40px; background: radial-gradient(circle at 50% 50%, rgba(34,197,94,.16), rgba(4,20,13,0) 70%); border: 1px solid rgba(74,222,128,.18); }
.phone { width: 300px; height: 645px; border-radius: 46px; background: #0b0f0d; padding: 12px; box-shadow: 0 40px 100px rgba(0,0,0,.6), 0 0 0 2px #2b3a33 inset; }
.phone .scr { width: 100%; height: 100%; border-radius: 36px; overflow: hidden; position: relative; background: #fff; }
.monitor { width: 640px; height: 412px; border-radius: 18px; background: #0b0f0d; padding: 12px; box-shadow: 0 40px 100px rgba(0,0,0,.6); }
.monitor .scr { width: 100%; height: 100%; border-radius: 8px; overflow: hidden; position: relative; }
.stand { width: 160px; height: 76px; margin: 0 auto; background: linear-gradient(#1f2a25, #0b0f0d); clip-path: polygon(35% 0, 65% 0, 80% 100%, 20% 100%); }
.node { width: 230px; height: 230px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #eafff2; font-weight: 700; font-size: 22px; gap: 6px;
  background: radial-gradient(circle at 35% 30%, #2a7a5c, #0a2a1d 75%); border: 2px solid rgba(74,222,128,.55); box-shadow: 0 0 80px rgba(34,197,94,.45); }
.node small { font: 600 14px "JB Mono", monospace; color: var(--g300); }
.badge { padding: 14px 22px; font-weight: 700; font-size: 20px; white-space: nowrap; display: flex; align-items: center; gap: 12px; border-radius: 16px; }
.badge .ic { width: 34px; height: 34px; border-radius: 10px; background: var(--g500); display: flex; align-items: center; justify-content: center; }
.status { padding: 10px 18px; border-radius: 999px; font: 700 17px "JB Mono", monospace; white-space: nowrap; color: #fff; }

/* feature wall */
.ft { width: 500px; padding: 14px 14px 18px; }
.ft .img { width: 472px; height: 295px; border-radius: 12px; background-color: #f5f7f6; background-repeat: no-repeat; box-shadow: 0 0 0 1px rgba(255,255,255,.25); }
.ft h4 { font-size: 25px; margin: 16px 6px 0; color: #fff; letter-spacing: -.01em; }
.ft p { font-size: 16px; margin: 4px 6px 0; color: rgba(220,252,231,.75); }
</style>
</head>
<body>
<div id="stage">
  <div class="scene" id="bg"><div class="obj" id="floor"></div></div>
  <div class="scene" id="s-intro"></div>
  <div class="scene" id="s-reg"></div>
  <div class="scene" id="s-ins"></div>
  <div class="scene" id="s-net"></div>
  <div class="scene" id="s-ft"></div>
  <div class="scene" id="s-end"></div>
  <div id="vignette"></div>
  <div id="capshade"></div>
  <div id="brandbug"><img src="assets/sellix-mark.png" alt="">Sellix POS</div>
  <div id="realui"><i></i>REAL APP · SCREEN CAPTURE</div>
  <div id="caption"><div class="k"></div><div class="h"></div></div>
  <div id="fade"></div>
</div>

<script>
const DURATION = 40;
const $ = (s, r = document) => r.querySelector(s);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, p) => a + (b - a) * p;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eio = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const eout = p => 1 - Math.pow(1 - p, 3);
const back = p => { const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const pulse = (t, a, d = .35) => Math.sin(seg(t, a, a + d) * Math.PI);
let rnd = 7; const rand = () => (rnd = (rnd * 16807) % 2147483647) / 2147483647;

let SA = 1;
function T(el, { x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, s = 1, c = true } = {}) {
  el.style.transform = `translate3d(${x}px,${y}px,${z}px) rotateZ(${rz}deg) rotateY(${ry}deg) rotateX(${rx}deg) scale(${s})` + (c ? " translate(-50%,-50%)" : "");
}
function O(el, a) { const v = clamp(a) * SA; el.style.opacity = v; el.style.visibility = v <= 0.001 ? "hidden" : "visible"; }
function cam(el, { x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0 }) {
  el.style.transform = `rotateZ(${rz}deg) rotateX(${rx}deg) rotateY(${ry}deg) translate3d(${-x}px,${-y}px,${-z}px)`;
}
function mk(parent, html, cls = "obj", style = {}) {
  const d = document.createElement("div"); d.className = cls; d.innerHTML = html; Object.assign(d.style, style); parent.appendChild(d); return d;
}
const px = v => v + "px";
function sceneAlpha(t, a, b, fi = .7, fo = .7) { return Math.min(seg(t, a, a + fi), 1 - seg(t, b - fo, b)); }
/** Stack of real screenshots in one element; show(i, p) crossfades layer i-1 → i. */
function layers(parent, srcs) {
  const els = srcs.map(s => mk(parent, "", "layer", { backgroundImage: `url(shots/${s}.jpg)` }));
  return (idx, p = 1) => els.forEach((el, i) => { el.style.opacity = i === idx ? 1 : i === idx - 1 ? 1 - p : 0; el.style.zIndex = i === idx ? 2 : 1; });
}
function cuboid(parent, w, h, d, col) {
  const c = mk(parent, "");
  [[w, h, `translateZ(${d / 2}px)`, col.front], [w, h, `rotateY(180deg) translateZ(${d / 2}px)`, col.side],
   [d, h, `rotateY(90deg) translateZ(${w / 2}px)`, col.side], [d, h, `rotateY(-90deg) translateZ(${w / 2}px)`, col.side],
   [w, d, `rotateX(90deg) translateZ(${h / 2}px)`, col.top], [w, d, `rotateX(-90deg) translateZ(${h / 2}px)`, col.side]]
    .forEach(([fw, fh, tf, bg]) => mk(c, "", "face", { width: px(fw), height: px(fh), marginLeft: px(-fw / 2), marginTop: px(-fh / 2), transform: tf, background: bg }));
  return c;
}
const ICON = {
  check: '<svg width="W" height="W" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  db: '<svg width="W" height="W" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v13c0 1.7 3.6 3 8 3s8-1.3 8-3v-13M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>',
  bt: '<svg width="W" height="W" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7l10 10-5 4V3l5 4L7 17"/></svg>',
  cloud: '<svg width="W" height="W" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"><path d="M7 18a5 5 0 01-.5-10A6 6 0 0118 9a4.5 4.5 0 01-.5 9z"/></svg>',
};
const icon = (n, w = 30) => ICON[n].replace(/W/g, w);

/* ---------------- background ---------------- */
const bg = $("#bg"), floor = $("#floor");
const dots = [];
for (let i = 0; i < 110; i++) {
  const d = mk(bg, "", "dot obj"); const s = 2 + rand() * 4; d.style.width = d.style.height = px(s);
  dots.push({ el: d, x: (rand() - .5) * 4200, y: (rand() - .5) * 2400, z: -2600 + rand() * 3000, sp: 20 + rand() * 60, ph: rand() * 6.28, a: .25 + rand() * .75 });
}
function renderBg(t) {
  SA = 1;
  cam(bg, { x: Math.sin(t * .17) * 120, y: -40, rx: -4, ry: Math.sin(t * .23) * 8 + lerp(-6, 6, t / DURATION) });
  T(floor, { y: 520, z: -900, rx: 90 });
  floor.style.backgroundPosition = `0 ${(t * 70) % 140}px`;
  for (const d of dots) {
    const z = ((d.z + t * d.sp * 6 + 2600) % 3000) - 2600;
    T(d.el, { x: d.x, y: d.y + Math.sin(t * .6 + d.ph) * 30, z });
    d.el.style.opacity = d.a * Math.min(seg(z, -2600, -2200), 1 - seg(z, 200, 400));
  }
}

/* ---------------- 1. intro (0 – 5.2) ---------------- */
const SI = $("#s-intro");
const iMark = mk(SI, '<div class="markcard"></div>');
const iTitle = mk(SI, '<div class="title">' + "Sellix".split("").map(c => `<span>${c}</span>`).join("") + ' <span class="pos">POS</span></div>');
const iSub = mk(SI, '<div class="sub">The point of sale your café already runs on — in three dimensions.</div>');
const iRing = [0, 1, 2].map(() => mk(SI, '<div style="width:520px;height:520px;border-radius:50%;border:2px solid rgba(74,222,128,.45)"></div>'));
const iLetters = [...iTitle.querySelectorAll("span")];
function renderIntro(t) {
  const p = seg(t, 0, 5.2);
  cam(SI, { z: lerp(-300, 260, eio(p)), ry: lerp(-14, 10, eio(p)), rx: lerp(6, -2, p) });
  const m = eout(seg(t, .3, 1.9));
  T(iMark, { y: lerp(260, -170, m), z: lerp(-600, 0, m), ry: lerp(-120, 0, m) + Math.sin(t * 1.2) * 6, rx: lerp(40, 0, m) });
  O(iMark, seg(t, .3, .9));
  iRing.forEach((r, i) => {
    const q = seg(t, 1.1 + i * .35, 3.3 + i * .35);
    T(r, { y: -170, z: -40 - i * 60, rx: 72, s: lerp(.3, 1.6 + i * .4, eout(q)) });
    O(r, Math.sin(q * Math.PI) * .9);
  });
  T(iTitle, { y: 60, z: 40 }); O(iTitle, 1);
  iLetters.forEach((l, i) => {
    const q = eout(seg(t, 1.3 + i * .08, 2.2 + i * .08));
    l.style.transform = `translate3d(0,${lerp(70, 0, q)}px,0) rotateX(${lerp(-80, 0, q)}deg)`;
    l.style.opacity = q;
  });
  T(iSub, { y: 175, z: 20 }); O(iSub, seg(t, 2.4, 3.2));
  iSub.style.letterSpacing = lerp(.06, -.01, eout(seg(t, 2.4, 3.6))) + "em";
}

/* ---------------- 2/3. register → payment → receipt (4.6 – 19.2) ---------------- */
// Screens were captured at 1600×1000 CSS px; K maps those coordinates onto the panel.
const SR = $("#s-reg");
const PW = 1440, PH = 900, K = PW / 1600;
const ADDS = [ // tile rects from shots.json (CSS px) and the cart row each add lands on
  { tile: { x: 465, y: 427, w: 165, h: 192 }, row: 0 },
  { tile: { x: 112, y: 427, w: 165, h: 192 }, row: 1 },
  { tile: { x: 819, y: 223, w: 165, h: 192 }, row: 2 },
  { tile: { x: 995, y: 427, w: 165, h: 192 }, row: 3 },
  { tile: { x: 289, y: 427, w: 165, h: 192 }, row: 4 },
  { tile: { x: 465, y: 427, w: 165, h: 192 }, row: 0 },
];
const ADD_T = [6.3, 7.0, 7.7, 8.4, 9.1, 9.8];
const ROW_Y = [306, 367, 428, 489, 550];
const reg = mk(SR, '<div class="edge"></div>', "obj screen", { width: px(PW), height: px(PH) });
const regShow = layers(reg, ["sales-0", "sales-1", "sales-2", "sales-3", "sales-4", "sales-5", "sales-6"]);
const regDim = mk(reg, "", "dim");
const tokens = ADDS.map(a => mk(reg, "", "obj token", {
  width: px(a.tile.w * K), height: px(125 * K),
  backgroundImage: "url(shots/sales-0.jpg)", backgroundSize: `${PW}px ${PH}px`,
  backgroundPosition: `${-a.tile.x * K}px ${-a.tile.y * K}px`,
}));
const taps = [...ADDS.map(() => mk(reg, "", "obj tap")), mk(reg, "", "obj tap")];
const MODAL = { x: 352, y: 148, w: 896, h: 704 };
const modal = mk(SR, '<div class="edge" style="border-radius:16px"></div>', "obj screen", { width: px(MODAL.w * K), height: px(MODAL.h * K), borderRadius: "16px", overflow: "visible" });
const modalShow = ["pay-0", "pay-1", "done-0", "done-1"].map(s => mk(modal, "", "layer", {
  backgroundImage: `url(shots/${s}.jpg)`, backgroundSize: `${PW}px ${PH}px`, backgroundPosition: `${-MODAL.x * K}px ${-MODAL.y * K}px`,
}));
const modalTaps = [mk(modal, "", "obj tap"), mk(modal, "", "obj tap")];
const printer = cuboid(SR, 380, 160, 280, { front: "linear-gradient(#2b3631,#141b18)", side: "#101613", top: "linear-gradient(#3a4741,#222b27)" });
const pLed = mk(printer, '<div style="width:14px;height:14px;border-radius:50%;background:#22c55e;box-shadow:0 0 16px 4px #22c55e"></div>');
const pSlot = mk(printer, '<div style="width:350px;height:10px;border-radius:5px;background:#050806"></div>');
const pLabel = mk(printer, '<div style="font:700 15px \'JB Mono\',monospace;color:#9ca3af;letter-spacing:.2em;white-space:nowrap">SELLIX · ESC/POS 80mm</div>');
const RH = Math.round(300 * 767 / 477) + 24;
const rwrap = mk(printer, `<div class="paper" style="height:${RH}px"></div>`, "rwrap");
function tapAt(el, x, y, p) { T(el, { x, y, z: 6, s: lerp(.4, 1.6, p) }); O(el, p > 0 && p < 1 ? 1 - p : 0); }
function renderReg(t) {
  const inP = eio(seg(t, 4.6, 6.2)), payP = eio(seg(t, 10.5, 11.5)), prP = eio(seg(t, 14.2, 15.4));
  let c = { x: 0, y: 0, z: lerp(900, 120, inP), rx: lerp(18, 6, inP), ry: lerp(-30, -14, inP) };
  c.ry += Math.sin(t * .5) * 2 + seg(t, 6.2, 10.4) * 10;
  c = { x: lerp(c.x, 40, payP), y: lerp(c.y, -20, payP), z: lerp(c.z, 120, payP), rx: lerp(c.rx, 3, payP), ry: lerp(c.ry, -8, payP) };
  c.ry += seg(t, 11.5, 14.2) * 6;
  c = { x: lerp(c.x, 900, prP), y: lerp(c.y, -200, prP), z: lerp(c.z, -60, prP), rx: lerp(c.rx, 8, prP), ry: lerp(c.ry, -26, prP) };
  c.ry += seg(t, 15.4, 19.2) * 10; c.z -= seg(t, 15.4, 19.2) * 120;
  cam(SR, c);

  T(reg, { z: lerp(0, -260, prP), ry: lerp(0, 8, prP) });
  O(reg, lerp(1, .4, prP));
  // each tap swaps in the next real screenshot and flies the product into the order
  let idx = 0;
  ADDS.forEach((a, i) => {
    const t0 = ADD_T[i], p = seg(t, t0, t0 + .6), e = eio(p);
    const from = { x: (a.tile.x + a.tile.w / 2) * K, y: (a.tile.y + 62) * K };
    const to = { x: 1300 * K, y: ROW_Y[a.row] * K };
    T(tokens[i], { x: lerp(from.x, to.x, e), y: lerp(from.y, to.y, e) - Math.sin(p * Math.PI) * 80, z: Math.sin(p * Math.PI) * 300 + 4, s: lerp(1, .45, e) + Math.sin(p * Math.PI) * .3, ry: lerp(0, 20, e) });
    O(tokens[i], p > 0 && p < 1 ? 1 : 0);
    tapAt(taps[i], from.x, from.y + 30, seg(t, t0 - .05, t0 + .45));
    if (t >= t0 + .05) idx = i + 1;
  });
  regShow(idx, idx ? eout(seg(t, ADD_T[idx - 1] + .05, ADD_T[idx - 1] + .25)) : 1);
  tapAt(taps[6], 1384 * K, 932 * K, seg(t, 10.2, 10.65));
  regDim.style.opacity = eio(seg(t, 10.4, 10.9)) * (1 - prP);

  // payment modal: the real dialog, lifted out of the screen in 3D
  const mp = back(seg(t, 10.5, 11.4)), mOut = eio(seg(t, 14.0, 14.7));
  T(modal, { x: lerp(200, 0, mp) + mOut * 160, y: lerp(160, 0, mp), z: lerp(-150, 230, mp) + mOut * 420, ry: lerp(-30, -4, mp) + mOut * 30, rx: lerp(18, 0, mp) });
  O(modal, seg(t, 10.5, 10.85) * (1 - mOut));
  const st = t < 11.95 ? 0 : t < 12.9 ? 1 : t < 13.5 ? 2 : 3;
  const switchT = [0, 11.95, 12.9, 13.5][st];
  modalShow.forEach((el, i) => { el.style.opacity = i === st ? 1 : i === st - 1 ? 1 - eout(seg(t, switchT, switchT + .2)) : 0; el.style.zIndex = i === st ? 2 : 1; });
  tapAt(modalTaps[0], (1072 - MODAL.x) * K, (585 - MODAL.y) * K, seg(t, 11.8, 12.3));
  tapAt(modalTaps[1], (849 - MODAL.x) * K, (809 - MODAL.y) * K, seg(t, 12.75, 13.25));

  // printer + the real receipt the sale produced
  const pp = back(seg(t, 14.2, 15.1));
  T(printer, { x: 1060, y: lerp(560, 60, pp), z: 220, ry: lerp(-60, -22, pp), rx: -6 });
  O(printer, seg(t, 14.2, 14.5));
  T(pLed, { x: 150, y: 34, z: 141 });

const SW = $("#s-net");

function renderNet(t) {
  const p = seg(t, 25.6, 31.6);

  const BRX = 58;

  const onB = (bx, by, lift = 0) => { const dy = by - 500, r = BRX * Math.PI / 180; return { x: bx - 900, y: 160 + dy * Math.cos(r) - lift, z: dy * Math.sin(r) }; };
  const pop = a => back(seg(t, a, a + .8));

  const a1 = pop(26.1), a2 = pop(26.35), a3 = pop(26.6), a4 = pop(26.85);
  T(phone, { ...P1, y: P1.y + (1 - a1) * 300, ry: 16 + Math.sin(t) * 4, s: a1 }); O(phone, seg(t, 26.1, 26.4));
  phoneShow(t < 28.6 ? 0 : 1, eout(seg(t, 28.6, 28.8)));
  T(mon, { ...P2, y: P2.y + (1 - a2) * 300, s: a2 }); O(mon, seg(t, 26.35, 26.6));
  T(prn, { ...P3, y: P3.y + (1 - a3) * 300, ry: -18, s: a3 }); O(prn, seg(t, 26.6, 26.9));
  T(cloud, { ...P4, y: P4.y - 60 + Math.sin(t * 1.4) * 12, s: a4 }); O(cloud, seg(t, 26.85, 27.1));
  const offline = t > 28.2 && t < 29.8;
  linkEls.forEach((l, i) => {
    const off = i === 0 && offline;

  });
  const BM = onB(900, 260, 260);
  T(beam, BM); O(beam, eout(seg(t, 27.4, 28)));

  const bp = i => eout(seg(t, 27.6 + i * .3, 28.3 + i * .3));
  const B1 = onB(560, 900, 90), B2 = onB(1420, 640, 360), B3 = onB(1500, 260, 520);

  T(bBt, { ...B2, z: B2.z + 80 + (1 - bp(1)) * 200 }); O(bBt, bp(1));
  T(bAnd, { ...B3, z: B3.z + (1 - bp(2)) * 200 }); O(bAnd, bp(2));
}

/* ---------------- captions & master ---------------- */
const CAPS = [
  [5.4, 10.2, "REGISTER", "Ring up orders in seconds."],
  [10.5, 14.0, "PAYMENTS", "Cash, card or GCash. Change worked out for you."],
  [14.4, 18.5, "PRINTING", "The real receipt, sent to your thermal printer."],
  [19.4, 25.6, "INSIGHTS", "Live sales, stock alerts and reports."],
  [26.3, 31.1, "EVERYWHERE", "Android & desktop. Keeps selling offline."],
  [31.7, 35.5, "OPERATIONS", "Everything your store runs on, built in."],
];
const capEl = $("#caption"), capK = $("#caption .k"), capH = $("#caption .h");
function renderCaption(t) {
  const c = CAPS.find(c => t >= c[0] && t <= c[1]);
  if (!c) { capEl.style.opacity = 0; return; }
  const a = Math.min(seg(t, c[0], c[0] + .5), 1 - seg(t, c[1] - .4, c[1]));
  capK.textContent = c[2]; capH.textContent = c[3];
  capEl.style.opacity = a;
  capEl.style.transform = `translateY(${lerp(24, 0, eout(seg(t, c[0], c[0] + .6)))}px)`;
  capEl.style.filter = `blur(${(1 - a) * 6}px)`;
}
const SCENES = [
  [SI, 0, 5.2, renderIntro, 0, .7],
  [SR, 4.6, 19.2, renderReg, .8, .8],
  [SN, 18.6, 26.2, renderIns, .7, .7],
  [SW, 25.6, 31.6, renderNet, .7, .7],
  [SF, 31.2, 36.0, renderFt, .6, .6],
  [SE, 35.6, 40.1, renderEnd, .6, .01],
];
window.render = function (t) {
  renderBg(t);
  for (const [el, a, b, fn, fi, fo] of SCENES) {
    if (t < a || t > b) { el.classList.add("hide"); continue; }
    el.classList.remove("hide");
    SA = fi === 0 ? 1 - seg(t, b - fo, b) : sceneAlpha(t, a, b, fi, fo);
    fn(t);
  }
  renderCaption(t);
  const ui = seg(t, 5, 6) * (1 - seg(t, 35.2, 35.8));
  $("#brandbug").style.opacity = ui * .9;
  $("#realui").style.opacity = ui * .85 * (1 - Math.min(seg(t, 25.4, 25.9), 1 - seg(t, 31.2, 31.7)));
  $("#fade").style.opacity = Math.max(1 - seg(t, 0, .6), seg(t, 39.2, 40));
};
window.DURATION = DURATION;
const preload = [...new Set([...document.querySelectorAll("[style*='url(']")].flatMap(el => [...el.getAttribute("style").matchAll(/url\(([^)]+)\)/g)].map(m => m[1])))];
window.ready = Promise.all([document.fonts.ready, ...preload.map(src => { const i = new Image(); i.src = src; return i.decode().catch(() => {}); }), ...[...document.images].map(i => i.decode().catch(() => {}))]);
if (!/[?&]capture/.test(location.search)) {
  const t0 = performance.now();
  window.ready.then(() => { const loop = now => { render(((now - t0) / 1000) % DURATION); requestAnimationFrame(loop); }; requestAnimationFrame(loop); });
}
